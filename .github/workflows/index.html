<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIMAL Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #e5ddd5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 450px; height: 100vh; background: #efeae2; display: flex; flex-direction: column; }
        .chat-header { background: #075e54; color: white; padding: 15px; font-weight: bold; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-wrap: break-word; }
        .message.sent { background: #dcf8c6; align-self: flex-end; }
        .message.received { background: #ffffff; align-self: flex-start; }
        .message .time { font-size: 10px; color: #888; text-align: right; margin-top: 4px; }
        .chat-input { display: flex; padding: 10px; background: #f0f0f0; gap: 8px; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .chat-input button { background: #128c7e; color: white; border: none; padding: 10px 16px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">💬 BIMAL Chat</div>
    <div class="chat-messages" id="messagesContainer"></div>
    <form class="chat-input" id="chatForm">
        <input type="text" id="messageInput" placeholder="Qor fariinta..." required autocomplete="off">
        <button type="submit">➢</button>
    </form>
</div>

<!-- Firebase Libraries -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    // 1. KU BEDDEL CONFIG-KAAGA RASMIGA AH
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const messagesContainer = document.getElementById('messagesContainer');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const userId = "User_" + Math.floor(Math.random() * 1000);

    chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = messageInput.value.trim();
        if (text !== '') {
            db.ref("messages").push({
                sender: userId,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            messageInput.value = '';
        }
    });

    db.ref("messages").on("child_added", (snapshot) => {
        const msg = snapshot.val();
        const messageElement = document.createElement('div');
        messageElement.classList.add('message');
        messageElement.classList.add(msg.sender === userId ? 'sent' : 'received');
        messageElement.innerHTML = `<div>${msg.text}</div><div class="time">${msg.time}</div>`;
        messagesContainer.appendChild(messageElement);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });
</script>

</body>
</html>
